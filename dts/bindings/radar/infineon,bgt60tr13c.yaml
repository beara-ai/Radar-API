description: |
  Infineon BGT60TR13C 60 GHz FMCW radar sensor, SPI-attached.

  Describes the bus wiring and the board-level facts about how the sensor
  is fitted, and the frame profile the application runs it with: the
  generic frame properties from radar-fmcw.yaml, and the register list
  that programs the radar to produce them (register-profile). The build
  fails, naming the property, if the two disagree.

  The driver reports the antenna geometry and calibration below through
  radar_fmcw_get_device_info(), and the active profile through
  radar_fmcw_get_frame_config(), so processing code configures itself
  from the device.

compatible: "infineon,bgt60tr13c"

include: [spi-device.yaml, radar-fmcw.yaml]

properties:
  reset-gpios:
    type: phandle-array
    required: true
    description: RSTN pin (active low, per the BGT60TR13C datasheet)

  irq-gpios:
    type: phandle-array
    required: true
    description: |
      FIFO CREF interrupt pin. Rises when the FIFO fill level passes the
      threshold set by xensiv_bgt60trxx_set_fifo_limit().

  register-profile:
    type: string
    required: true
    enum:
      - "people-tracking"
      - "custom"
    description: |
      Register list that programs this radar, generated by Infineon's
      bgt60-configurator-cli. Its frames must match this node's frame
      properties, and the build fails, naming the property, if they don't.
      The generated header only says how many RX antennas it enables, so
      rx-mask is checked by count: make sure it also names the antennas the
      register list was generated with (rx_antennas in its config.json).
      The BGT60TR13C has one TX antenna, so tx-pattern is always <0x1>.

      - people-tracking: 58.0-59.2 GHz (0.125 m range bins), Rx1..Rx3,
        128 samples x 32 chirps, 100 us chirps, 10 Hz frames. Range to
        about 8 m, +/-12.8 m/s. Matching frame properties:
          start-freq-khz = <58000000>; stop-freq-khz = <59200000>;
          samples-per-chirp = <128>; chirps-per-frame = <32>;
          sample-rate-hz = <2000000>; chirp-period-ns = <100050>;
          frame-period-us = <100070>; rx-mask = <0x7>; tx-pattern = <0x1>;
      - custom: the header named by CONFIG_BGT60TR13C_PROFILE_CUSTOM_FILE.

  rx-positions-um:
    type: array
    default: [2500, 0, 0, 2500, 0, 0]
    description: |
      Phase-centre position of each physical RX antenna, Rx1, Rx2, Rx3 in
      that order, as <azimuth elevation> pairs in micrometres, viewed from
      the front of the sensor (azimuth positive to the right, elevation
      positive up) before any mounting rotation.

      The BGT60TR13C has its antennas in the package, so the default (the
      package's L-shaped lambda/2 layout: Rx1 beside Rx3, Rx2 above Rx3)
      is correct for every board using it and normally isn't overridden.
      The property exists so the description stays the same for radars
      whose antennas are on the PCB.

  rx-phase-offsets-mdeg:
    type: array
    default: [0, 0, 0]
    description: |
      Phase error of each physical RX antenna's receive path, Rx1, Rx2,
      Rx3 in that order, in millidegrees. Processing subtracts it from the
      channel's measured phase. Leave at zero for an uncalibrated board.
      Write negative values in parentheses, e.g. <0 (-1500) 2300>.

  rx-gain-offsets-mdb:
    type: array
    default: [0, 0, 0]
    description: |
      Gain error of each physical RX antenna's receive path, Rx1, Rx2, Rx3
      in that order, in millidecibels. Processing subtracts it from the
      channel's measured level. Leave at zero for an uncalibrated board.

  orientation:
    type: int
    default: 0
    enum: [0, 90, 180, 270]
    description: |
      Rotation of the sensor on the board in degrees, counter-clockwise as
      seen from the front. Applied to rx-positions-um before they are
      reported, so azimuth always means horizontal in the scene, e.g. a
      sensor mounted at 90 degrees measures azimuth across Rx2/Rx3
      instead of Rx1/Rx3.
